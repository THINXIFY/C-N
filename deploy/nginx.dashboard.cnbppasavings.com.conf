# Reverse proxy for dashboard.cnbppasavings.com -> the Next.js app on 127.0.0.1:3000 (PM2-managed).
# Reference only — copy to /etc/nginx/sites-available/dashboard.cnbppasavings.com on the VPS, symlink into
# sites-enabled, then `nginx -t` before reloading. Certbot will add the HTTPS server block and the
# HTTP -> HTTPS redirect on top of this when run with --nginx.
#
# This file intentionally affects only this one server_name — it must not replace or edit any existing
# server block for another site already hosted on the same VPS.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.cnbppasavings.com;

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
